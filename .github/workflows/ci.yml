name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一个分支上的旧运行没跑完就取消，省钱也省等待。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 必过项：编译 + JVM 单测 + lint。三条命令就是 README 里那三条。
  check:
    name: Build · Test · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 依赖解析和编译失败都在这一步暴露，不要在多个 step 里拆碎——日志一屏能看完最省事。
      - name: Assemble, unit test, lint
        run: ./gradlew assembleDebug testDebugUnitTest lint --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.xml

  # 可选：设备上的 Compose UI 测试。模拟器启动慢，只在手动触发时跑。
  instrumented:
    name: Instrumented tests (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/androidTests/

  # 手动触发：重新生成 Baseline Profile。
  #
  # 为什么不在 PR 上自动跑：它要起一台 GMD（模拟器）、跑一轮真实启动，
  # 3~6 分钟起步，而且产出的 profile 只有在首屏关键路径变化后才需要更新。
  # 放自动流程里 = 每个 PR 都为一个大概率没变的文件付出几分钟。
  #
  # 为什么这里**不**跑 macrobenchmark：CI 的虚拟化设备上数字噪声大，
  # 只适合看"有没有崩"，不适合看"快了多少"。量收益请在真机/本地跑（见 README）。
  performance:
    name: Baseline Profile (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # GMD 自己会起模拟器，但它同样需要 KVM 才能跑。
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate baseline profile
        run: ./gradlew :app:generateBaselineProfile --stacktrace

      # 产物要提交回仓库：它是打进包里的东西，不是可丢弃的构建输出。
      - name: Upload baseline profile
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          if-no-files-found: error
          path: app/src/release/generated/baselineProfiles/
