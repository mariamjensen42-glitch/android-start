##
## 唯一版本来源。改版本只改这里，构建脚本里不出现任何硬编码版本号。
##
## 这里的版本不是"各自取最新"，而是一条**互相咬合的链**，动一个要先看链条：
##
##   AGP 9.3.3  ──内建 Kotlin 编译──▶  Kotlin 2.3.20
##                                        │
##                     KSP 必须与 Kotlin 同版本 │（KSP 2.3.12 的 pom 依赖 kotlin-stdlib 2.3.20）
##                                        ▼
##                                   KSP 2.3.12 ──▶ Room 2.8.5 / Hilt 2.59.2
##
## 两个刻意的"不取最新"：
## 1. hilt 停在 2.59.2：2.59 是第一个支持 AGP 9 的 Hilt Gradle 插件版本（2.58 及以前在 AGP 9 上直接报错）；
##    2.60.x 把 kotlin-stdlib 要求抬到 2.3.21，会把 Kotlin 顶到 2.3.21 → KSP 2.3.12 就配不上了。
## 2. ksp 停在 2.3.12：它的 pom 依赖 kotlin-stdlib 2.3.20，正好等于本项目 Kotlin。
##
## 升级顺序：agp → kotlin → ksp（与 kotlin 对齐）→ hilt/room → composeBom → 其余。
## 升完必须跑 README 里那三条命令，绿了再提交。
##
[versions]
agp = "9.3.3"
kotlin = "2.3.20"
ksp = "2.3.12"

coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
navigation3 = "1.2.0"

hilt = "2.59.2"
androidxHilt = "1.4.0"
room = "2.8.5"

kotlinxSerialization = "1.10.0"
kotlinxCoroutines = "1.10.2"

junit = "4.13.2"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"
turbine = "1.1.0"

[libraries]
# --- 平台基线 ---------------------------------------------------------------
# BOM 统一管理 Compose 各 artifact 的版本；单独写版本的 Compose 依赖是 bug 来源。
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# --- Compose ---------------------------------------------------------------
# 注意：这几个不写版本，版本来自上面的 BOM。
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# --- Lifecycle / ViewModel -------------------------------------------------
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# 让 ViewModel 跟着 Nav3 的 NavEntry 走（每个导航 key 一份 ViewModelStore）。
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }

# --- Navigation 3 ----------------------------------------------------------
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }

# --- 依赖注入（Hilt） -------------------------------------------------------
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
# Nav3 场景下拿 ViewModel 用这个（`androidx.hilt.lifecycle.viewmodel.compose.hiltViewModel`），
# 不要用 hilt-navigation-compose —— 那个是配 Navigation 2 的，跟 Nav3 的 ViewModelStore 装饰器不是一套。
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }

# --- 持久化（Room） ---------------------------------------------------------
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
# Flow / 协程支持。
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# --- Kotlin 生态 -----------------------------------------------------------
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# --- 测试 ------------------------------------------------------------------
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9 起 Kotlin 编译内建在 AGP 里，**不再**应用 org.jetbrains.kotlin.android。
# 这两个插件分别只负责 Compose 编译器与 kotlinx.serialization 代码生成。
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Room 与 Hilt 的代码生成都走 KSP（不要用 kapt：AGP 9 的内建 Kotlin 跟 kapt 不兼容，
# 真要用 kapt 得换成 com.android.legacy-kapt，没有理由往回走）。
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
